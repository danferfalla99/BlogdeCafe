<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlogdeCafé - Contacto</title>
    <link rel="preload" href="css/tailwind.css" as="style" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="img/icon.ico" />
  </head>
  <body
    class="font-parrafos text-base leading-loose bg-gray-50 dark:bg-gray-900 dark:text-white transition-colors duration-300"
  >
    <header
      class="header relative bg-[url('../img/banner.webp')] bg-cover bg-center bg-no-repeat h-[60rem] flex flex-col justify-center"
    >
      <div class="absolute inset-0 bg-black/50"></div>
      <!-- Overlay -->
      <div
        class="contenedor relative z-10 max-w-[120rem] w-[90%] mx-auto h-full flex flex-col"
      >
        <div class="barra pt-12 md:flex md:justify-between md:items-center">
          <a class="logo text-blanco group" href="index.html">
            <h1
              class="logo-nombre m-0 text-center font-heading text-5xl font-normal text-white group-hover:scale-105 transition-transform duration-300"
            >
              Blog<span class="logo-bold font-bold">deCafé</span>
            </h1>
          </a>
          <nav
            class="navegacion mt-8 md:mt-0 flex flex-col md:flex-row gap-8 items-center"
          >
            <a
              href="nosotros.html"
              class="navegacion-enlace block text-center text-lg text-white hover:text-primario transition-colors duration-300 border-b-2 border-transparent hover:border-primario pb-1"
              >Nosotros</a
            >
            <a
              href="cursos.html"
              class="navegacion-enlace block text-center text-lg text-white hover:text-primario transition-colors duration-300 border-b-2 border-transparent hover:border-primario pb-1"
              >Cursos</a
            >
            <a
              href="contacto.html"
              class="navegacion-enlace block text-center text-lg text-white hover:text-primario transition-colors duration-300 border-b-2 border-transparent hover:border-primario pb-1"
              >Contacto</a
            >
          </nav>
        </div>
        <div class="header-texto text-center text-white mt-auto mb-20 md:mb-32">
          <h2
            class="m-0 font-heading text-[40px] md:text-6xl leading-tight drop-shadow-lg"
          >
            Blog de café con consejos y cursos
          </h2>
          <p class="m-0 text-lg md:text-xl mt-4 font-light drop-shadow-md">
            Aprende de los expertos con las mejores recetas y consejos
          </p>
        </div>
      </div>
    </header>

    <main class="contenedor max-w-[120rem] w-[90%] mx-auto mt-16 mb-16">
      <h3
        class="text-center font-heading text-4xl mb-12 dark:text-white border-b-4 border-primario inline-block pb-2 mx-auto"
      >
        Contacto
      </h3>
      <div
        class="contacto-bg bg-[url('../img/contacto.jpg')] h-[40rem] bg-cover bg-center bg-no-repeat rounded-t-2xl shadow-lg"
      ></div>

      <form
        class="formulario bg-white p-12 md:w-[80%] md:mx-auto md:-mt-20 md:p-20 shadow-2xl rounded-2xl dark:bg-gray-800 relative z-10"
      >
        <div class="campo flex flex-col md:flex-row mb-8 items-center">
          <label
            class="campo-label md:flex-[0_0_9rem] text-left md:text-right md:pr-8 font-heading font-bold text-lg dark:text-white mb-2 md:mb-0 w-full md:w-auto"
            for="nombre"
            >Nombre</label
          >
          <input
            class="campo-field flex-1 border border-gray-300 p-4 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-primario focus:border-transparent transition-shadow dark:bg-gray-700 dark:text-white dark:border-gray-600"
            type="text"
            placeholder="Tu Nombre"
            id="nombre"
          />
        </div>

        <div class="campo flex flex-col md:flex-row mb-8 items-center">
          <label
            class="campo-label md:flex-[0_0_9rem] text-left md:text-right md:pr-8 font-heading font-bold text-lg dark:text-white mb-2 md:mb-0 w-full md:w-auto"
            for="email"
            >E-mail</label
          >
          <input
            class="campo-field flex-1 border border-gray-300 p-4 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-primario focus:border-transparent transition-shadow dark:bg-gray-700 dark:text-white dark:border-gray-600"
            type="email"
            placeholder="Tu Correo"
            id="email"
          />
        </div>

        <div class="campo flex flex-col md:flex-row mb-8 items-start">
          <label
            class="campo-label md:flex-[0_0_9rem] text-left md:text-right md:pr-8 font-heading font-bold text-lg dark:text-white mb-2 md:mb-0 w-full md:w-auto pt-2"
            for="mensaje"
            >Mensaje</label
          >
          <textarea
            class="campo-field campo-field-textarea flex-1 border border-gray-300 p-4 h-48 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-primario focus:border-transparent transition-shadow dark:bg-gray-700 dark:text-white dark:border-gray-600 resize-none"
            id="mensaje"
          ></textarea>
        </div>

        <div class="campo flex justify-end">
          <input
            type="submit"
            value="Enviar"
            class="boton boton-primario bg-negro text-white py-4 px-12 uppercase font-bold text-lg rounded-lg shadow-md hover:bg-primario hover:shadow-lg hover:-translate-y-1 transition-all duration-300 cursor-pointer dark:bg-primario dark:hover:bg-white dark:hover:text-primario"
          />
        </div>
      </form>
    </main>

    <footer
      class="footer bg-negro pb-12 mt-16 pt-12 border-t-4 border-primario"
    >
      <div class="contenedor max-w-[120rem] w-[90%] mx-auto">
        <div class="barra md:flex md:justify-between md:items-center">
          <a class="logo text-blanco group" href="index.html">
            <h1
              class="logo-nombre m-0 text-center font-heading text-4xl font-normal text-white group-hover:text-primario transition-colors duration-300"
            >
              Blog<span class="logo-bold font-bold">deCafé</span>
            </h1>
          </a>
          <nav
            class="navegacion mt-8 md:mt-0 flex flex-col md:flex-row gap-8 items-center"
          >
            <a
              href="nosotros.html"
              class="navegacion-enlace block text-center text-lg text-white hover:text-primario transition-colors duration-300"
              >Nosotros</a
            >
            <a
              href="cursos.html"
              class="navegacion-enlace block text-center text-lg text-white hover:text-primario transition-colors duration-300"
              >Cursos</a
            >
            <a
              href="contacto.html"
              class="navegacion-enlace block text-center text-lg text-white hover:text-primario transition-colors duration-300"
              >Contacto</a
            >
          </nav>
        </div>
        <p class="text-center text-gray-400 mt-10 text-sm">
          Todos los derechos reservados &copy; 2025
        </p>
      </div>
    </footer>
  </body>
</html>
